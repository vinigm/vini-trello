name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# A publicação empurra o site para a branch gh-pages e o Pages serve dela.
# O caminho anterior (actions/deploy-pages) dependia da fila de implantação do
# Pages, que ficava presa além do timeout máximo de 10 minutos do action.
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v5
      - name: Preparar pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
      - name: Preparar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Instalar dependências
        run: pnpm install --frozen-lockfile
      - name: Gerar site
        run: pnpm build
      - name: Publicar na branch gh-pages
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          touch dist/.nojekyll
          cd dist
          git init -q
          git checkout -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "deploy $GITHUB_SHA"
          git push -q --force "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
